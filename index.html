<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roue Généalogique</title>
<style>
:root{--bg:#F5F6F9;--ink:#1E2230;--muted:#6B7185;--line:#E3E5EC;--surface:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171D;--ink:#ECEEF4;--muted:#9AA0B2;--line:#2C303B;--surface:#1E2129}}
:root[data-theme="dark"]{--bg:#15171D;--ink:#ECEEF4;--muted:#9AA0B2;--line:#2C303B;--surface:#1E2129}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1 system-ui,-apple-system,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px clamp(14px,3vw,40px);border-bottom:1px solid var(--line);background:var(--bg)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;padding:8px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar small{color:var(--muted);font-weight:500;line-height:1.3}
.frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<div class="bar"><div class="tabs" role="tablist" aria-label="Vues"><button role="tab" id="tW" aria-selected="true" aria-controls="fW">Roue</button><button role="tab" id="tT" aria-selected="false" aria-controls="fT">Arbre</button></div><small>La personne affichée vous suit d'une vue à l'autre.</small></div>
<div class="frames"><iframe id="fW" title="Roue généalogique" src="roue.html"></iframe><iframe id="fT" title="Arbre" hidden></iframe></div>
<script>
// Each view is its own page; they expose window.__cur() (person shown) and window.__go(id) (show a person).
const fW=document.getElementById('fW'), fT=document.getElementById('fT');
let tLoaded=false, pending=null;
fT.addEventListener('load',()=>{ tLoaded=true; if(pending){ try{fT.contentWindow.__go(pending)}catch(e){} pending=null; } });
function cur(f){ try{ return f.contentWindow.__cur(); }catch(e){ return null; } }
function sel(which){
  const toTree=which==='T';
  const id=cur(toTree?fW:fT);
  document.getElementById('tW').setAttribute('aria-selected',!toTree);
  document.getElementById('tT').setAttribute('aria-selected',toTree);
  fW.hidden=toTree; fT.hidden=!toTree;
  if(toTree){ if(!tLoaded){ pending=id; if(!fT.getAttribute('src')) fT.src='arbre.html'; } else if(id){ try{fT.contentWindow.__go(id)}catch(e){} } }
  else if(id){ try{fW.contentWindow.__go(id)}catch(e){} }
}
document.getElementById('tW').onclick=()=>sel('W');
document.getElementById('tT').onclick=()=>sel('T');
// Used by the tree's "Situer dans la famille" button: the path diagram lives in the wheel.
window.__has=id=>{ try{ return fW.contentWindow.__has(id); }catch(e){ return false; } };
window.__situer=id=>{ sel('W'); try{ fW.contentWindow.__situer(id); }catch(e){} };
</script>
</body>
</html>
